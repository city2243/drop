<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>我的收件匣</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --line: #e3e6eb; --accent: #2563eb; --accent-text: #ffffff;
    --danger: #c0392b; --ok: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --card: #1d2128; --text: #e6e8eb; --muted: #9aa3ae;
      --line: #2e333b; --accent: #4f8cff; --accent-text: #ffffff;
      --danger: #ef6b5b; --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  h2 { font-size: 17px; margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  textarea, input[type=password] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); font: inherit;
  }
  textarea { min-height: 110px; resize: vertical; }
  button {
    font: inherit; border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer;
    background: var(--accent); color: var(--accent-text);
  }
  button.ghost {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    padding: 4px 10px; font-size: 14px;
  }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .muted { color: var(--muted); font-size: 14px; }
  .status { font-size: 14px; min-height: 1.4em; }
  .status.err, .err { color: var(--danger); }
  .status.ok, .ok { color: var(--ok); }

  .drop {
    border: 2px dashed var(--line); border-radius: 12px; padding: 36px 16px; text-align: center;
    color: var(--muted); cursor: pointer; transition: border-color .15s;
  }
  .drop:hover { border-color: var(--accent); }
  .drop .big { font-size: 18px; color: var(--text); margin-bottom: 4px; }

  /* 整頁拖放:檔案拖進視窗任何地方都會出現這層 */
  #overlay {
    position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--accent) 18%, transparent); backdrop-filter: blur(2px);
  }
  #overlay.show { display: flex; }
  #overlay div {
    background: var(--card); color: var(--accent); border: 3px dashed var(--accent); border-radius: 16px;
    padding: 40px 48px; font-size: 22px; pointer-events: none; text-align: center;
  }

  ul { list-style: none; margin: 12px 0 0; padding: 0; }
  li { border-top: 1px solid var(--line); padding: 10px 0; }
  #queue li:first-child { border-top: 0; }
  .note-text { white-space: pre-wrap; word-break: break-word; margin: 0 0 6px; }
  .file-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .file-name { word-break: break-all; }
  .actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .bar.busy i { width: 35%; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  .hidden { display: none !important; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div id="overlay"><div>放開就存檔</div></div>
<main>
  <h1><span>我的收件匣</span><button id="logout" class="ghost hidden">登出這台裝置</button></h1>

  <!-- 登入 -->
  <section id="login" class="card hidden">
    <h2>輸入金鑰</h2>
    <p class="muted">內容存在你的私人 GitHub repo,沒有金鑰的人打開這頁什麼都看不到。金鑰只存在這台裝置的瀏覽器裡。</p>
    <input id="token" type="password" placeholder="github_pat_…" autocomplete="off">
    <div class="row">
      <label class="muted"><input id="remember" type="checkbox" checked> 記住這台裝置</label>
      <button id="loginBtn">進入</button>
    </div>
    <div id="loginStatus" class="status"></div>
  </section>

  <div id="app" class="hidden">
    <!-- 檔案 -->
    <section class="card">
      <div class="card-head"><h2>檔案(暫存)</h2></div>
      <div id="drop" class="drop">
        <div class="big">把檔案拖進這個視窗任何地方就存好</div>
        也可以點這裡選檔,或按 Ctrl+V 貼上檔案<br>
        <span class="muted">單檔最大 10 GB;超過 30 MB 會分段上傳,比較久</span>
      </div>
      <input id="fileInput" type="file" multiple class="hidden">
      <ul id="queue"></ul>
      <ul id="files"></ul>
      <div id="usage" class="muted" style="margin-top:8px"></div>
    </section>

    <!-- 文字 -->
    <section class="card">
      <div class="card-head"><h2>文字</h2></div>
      <textarea id="noteInput" placeholder="貼上要存的文字…(Ctrl+Enter 儲存)"></textarea>
      <div class="row">
        <button id="saveNote">儲存</button>
        <span id="noteStatus" class="status"></span>
      </div>
      <ul id="notes"></ul>
      <div class="row"><button id="moreNotes" class="ghost hidden">顯示更多</button></div>
    </section>
  </div>
</main>

<script>
// 儲存空間:私人 repo。網頁本身放在公開 repo,不含任何秘密。
const OWNER = "city2243";
const REPO = "drop-storage";
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;
const GIT = `https://api.github.com/repos/${OWNER}/${REPO}/git/`;
// GitHub API 單次寫入實測約 38–40 MB 就回 422,所以大檔切成 30 MB 一段(.partNofM),下載時接回
const CHUNK_BYTES = 30 * 1024 * 1024;
const MAX_BYTES = 10 * 1024 * 1024 * 1024;
const PART_RE = /\.part(\d+)of(\d+)$/;
// 這裡是暫存區:刪掉的檔仍留在 git 歷史裡佔空間,所以刪檔後把歷史清成只剩一個 commit,GitHub 之後會回收
const WARN_KB = 1024 * 1024;
const NOTES_PAGE = 30;

const $ = id => document.getElementById(id);
let token = "";
let noteEntries = [];   // notes/ 目錄清單(新到舊)
let notesShown = 0;

function readStored() {
  try { return localStorage.getItem("drop_token") || sessionStorage.getItem("drop_token") || ""; }
  catch { return ""; }
}
function store(t, remember) {
  try {
    if (remember) localStorage.setItem("drop_token", t); else sessionStorage.setItem("drop_token", t);
  } catch {}
}
function forget() {
  try { localStorage.removeItem("drop_token"); sessionStorage.removeItem("drop_token"); } catch {}
}

function setStatus(node, msg, kind) {
  node.textContent = msg;
  node.className = "status" + (kind ? " " + kind : "");
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

function encPath(path) {
  return path.split("/").map(encodeURIComponent).join("/");
}

async function ghFetch(url, opts = {}) {
  // GitHub 寫太快會回 403/429(次級速率限制),等一下再送
  for (let attempt = 0; ; attempt++) {
    const res = await fetch(url, {
      ...opts,
      headers: {
        "Authorization": "Bearer " + token,
        "Accept": opts.accept || "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        ...(opts.body ? { "Content-Type": "application/json" } : {}),
      },
      cache: "no-store",
    });
    const limited = res.status === 429 || (res.status === 403 && (res.headers.get("retry-after") || res.headers.get("x-ratelimit-remaining") === "0"));
    if (limited && attempt < 5) {
      const wait = Number(res.headers.get("retry-after") || 60);
      opts.onWait?.(wait);
      await sleep(wait * 1000);
      continue;
    }
    if (res.status === 404 && opts.allow404) return null;
    if (!res.ok) {
      let msg = res.status + " " + res.statusText;
      try { const j = await res.json(); if (j.message) msg = res.status + " " + j.message; } catch {}
      throw new Error(msg);
    }
    return res;
  }
}
const gh = (path, opts) => ghFetch(API + encPath(path), opts);

function bytesToB64(bytes) {
  let bin = "";
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}

// 用瀏覽器內建的 FileReader 轉 base64,大檔比逐字元拼字串省記憶體
function blobToB64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.slice(r.result.indexOf(",") + 1));
    r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });
}

function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function stampDate(name) {
  const m = name.match(/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})/);
  return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]) : new Date(0);
}
function timeLabel(d) {
  const p = n => String(n).padStart(2, "0");
  return d.getTime() ? `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}` : "";
}
function prettySize(n) {
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + " MB";
  return (n / 1024 / 1024 / 1024).toFixed(2) + " GB";
}

async function putFile(path, b64, message, onWait) {
  return gh(path, { method: "PUT", body: JSON.stringify({ message, content: b64 }), onWait });
}
async function deletePath(path, sha) {
  return gh(path, { method: "DELETE", body: JSON.stringify({ message: "delete " + path, sha }) });
}
async function listDir(dir) {
  const res = await gh(dir, { allow404: true });
  if (!res) return [];
  const items = await res.json();
  return items.filter(i => i.type === "file" && i.name !== ".keep")
              .sort((a, b) => b.name.localeCompare(a.name));
}
async function rawBlob(path) {
  const res = await gh(path, { accept: "application/vnd.github.raw" });
  return res.blob();
}

// ---------- 清歷史:main 換成一個沒有上一代的 commit(檔案不變) ----------
let cleanTimer = null;
function scheduleClean() {
  clearTimeout(cleanTimer);
  cleanTimer = setTimeout(cleanHistory, 3000);
}
async function cleanHistory() {
  // 還有檔在上傳就先不清,等傳完再說
  if (pumping || jobs.some(j => j.state === "wait" || j.state === "run")) return scheduleClean();
  try {
    const ref = await (await ghFetch(GIT + "ref/heads/main")).json();
    const head = await (await ghFetch(GIT + "commits/" + ref.object.sha)).json();
    if (!head.parents.length) return;   // 已經只剩一個 commit
    const fresh = await (await ghFetch(GIT + "commits", {
      method: "POST", body: JSON.stringify({ message: "清理暫存歷史(只保留目前的檔案)", tree: head.tree.sha }),
    })).json();
    await ghFetch(GIT + "refs/heads/main", { method: "PATCH", body: JSON.stringify({ sha: fresh.sha, force: true }) });
  } catch (e) { console.warn("清歷史失敗", e); }
  loadUsage();
}

// ---------- 登入 ----------
async function tryLogin(t, remember, quiet) {
  token = t.trim();
  if (!token) return;
  try {
    // 用 repo 根目錄測試金鑰能不能讀
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`, {
      headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" },
      cache: "no-store",
    });
    if (!res.ok) throw new Error(res.status === 401 ? "金鑰無效或已過期" : res.status === 404 ? "這把金鑰讀不到儲存空間(建立時要勾 drop-storage)" : "錯誤 " + res.status);
    store(token, remember);
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("logout").classList.remove("hidden");
    loadNotes(); refreshFiles();
  } catch (e) {
    token = "";
    if (quiet) forget();
    showLogin(quiet ? "記住的金鑰失效了,請重新輸入:" + e.message : e.message);
  }
}
function showLogin(msg) {
  $("app").classList.add("hidden");
  $("logout").classList.add("hidden");
  $("login").classList.remove("hidden");
  setStatus($("loginStatus"), msg || "", msg ? "err" : "");
}
$("loginBtn").onclick = () => tryLogin($("token").value, $("remember").checked, false);
$("token").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });
$("logout").onclick = () => { forget(); token = ""; $("token").value = ""; showLogin(); };

// ---------- 文字 ----------
async function loadNotes() {
  $("notes").innerHTML = '<li class="muted">載入中…</li>';
  try {
    noteEntries = await listDir("notes");
    notesShown = 0;
    $("notes").innerHTML = noteEntries.length ? "" : '<li class="muted">還沒有文字</li>';
    await showMoreNotes();
  } catch (e) { $("notes").innerHTML = `<li class="status err">讀取失敗:${e.message}</li>`; }
}
async function showMoreNotes() {
  const batch = noteEntries.slice(notesShown, notesShown + NOTES_PAGE);
  notesShown += batch.length;
  const texts = await Promise.all(batch.map(n => rawBlob(n.path).then(b => b.text()).catch(() => "(讀取失敗)")));
  batch.forEach((n, i) => $("notes").appendChild(noteItem(n, texts[i])));
  $("moreNotes").classList.toggle("hidden", notesShown >= noteEntries.length);
}
function noteItem(n, text) {
  const li = el("li");
  const row = el("div", "file-row");
  const acts = el("div", "actions");
  const copy = el("button", "ghost", "複製");
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(text); copy.textContent = "已複製"; }
    catch { copy.textContent = "複製失敗"; }
    setTimeout(() => copy.textContent = "複製", 1500);
  };
  const del = el("button", "ghost danger", "刪除");
  del.onclick = async () => {
    if (!confirm("刪除這則文字?")) return;
    del.disabled = true;
    try { await deletePath(n.path, n.sha); li.remove(); scheduleClean(); }
    catch (e) { alert("刪除失敗:" + e.message); del.disabled = false; }
  };
  acts.append(copy, del);
  row.append(el("span", "muted", timeLabel(stampDate(n.name))), acts);
  li.append(el("p", "note-text", text), row);
  return li;
}
$("moreNotes").onclick = showMoreNotes;
$("saveNote").onclick = async () => {
  const text = $("noteInput").value;
  if (!text.trim()) return;
  $("saveNote").disabled = true;
  setStatus($("noteStatus"), "儲存中…");
  try {
    await putFile(`notes/${stamp()}.txt`, bytesToB64(new TextEncoder().encode(text)), "add note");
    $("noteInput").value = "";
    setStatus($("noteStatus"), "已儲存", "ok");
    loadNotes();
  } catch (e) { setStatus($("noteStatus"), "儲存失敗:" + e.message, "err"); }
  $("saveNote").disabled = false;
};
$("noteInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("saveNote").click();
});

// ---------- 檔案清單 ----------
function displayName(name) { return name.replace(/^\d{8}-\d{6}_/, ""); }

// 把分段檔(xxx.part1of4 …)合成一筆;沒分段的檔就是只有一段
function groupFiles(items) {
  const groups = new Map();
  for (const it of items) {
    const m = it.name.match(PART_RE);
    const base = m ? it.name.replace(PART_RE, "") : it.name;
    if (!groups.has(base)) groups.set(base, { name: base, parts: [], total: m ? Number(m[2]) : 1, size: 0 });
    const g = groups.get(base);
    g.parts.push({ ...it, idx: m ? Number(m[1]) : 1 });
    g.size += it.size;
  }
  for (const g of groups.values()) {
    g.parts.sort((a, b) => a.idx - b.idx);
    g.complete = g.parts.length === g.total;
  }
  return [...groups.values()];
}

async function refreshFiles() {
  loadUsage();
  const ul = $("files");
  try {
    // 正在上傳中的分段檔不列出來,免得看到「不完整」
    const uploading = new Set(jobs.filter(j => j.state === "run" && j.base).map(j => j.base.replace(/^files\//, "")));
    const groups = groupFiles(await listDir("files")).filter(g => !uploading.has(g.name));
    ul.innerHTML = "";
    if (!groups.length) ul.appendChild(el("li", "muted", "還沒有檔案"));
    groups.forEach(g => ul.appendChild(fileItem(g)));
  } catch (e) { ul.innerHTML = ""; ul.appendChild(el("li", "status err", "讀取失敗:" + e.message)); }
}

async function loadUsage() {
  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`, {
      headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" }, cache: "no-store",
    });
    const kb = (await res.json()).size;
    const u = $("usage");
    u.textContent = `空間已用約 ${prettySize(kb * 1024)}(刪掉的檔要等 GitHub 回收,可能要幾小時)`;
    u.className = kb > WARN_KB ? "status err" : "muted";
  } catch {}
}

// 有「另存新檔」功能的瀏覽器(Chrome、Edge)邊下載邊寫進硬碟,幾 GB 的檔也不會吃光記憶體
async function downloadParts(f, onStep) {
  const name = displayName(f.name);
  if (window.showSaveFilePicker && f.parts.length > 1) {
    let handle;
    try { handle = await showSaveFilePicker({ suggestedName: name }); }
    catch (e) { if (e.name === "AbortError") return false; throw e; }
    const out = await handle.createWritable();
    try {
      for (const p of f.parts) {
        onStep(p.idx);
        await out.write(await rawBlob(p.path));
      }
      await out.close();
    } catch (e) { await out.abort().catch(() => {}); throw e; }
    return true;
  }
  const pieces = [];
  for (const p of f.parts) { onStep(p.idx); pieces.push(await rawBlob(p.path)); }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(pieces));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  return true;
}

function fileItem(f) {
  const li = el("li", "file-row");
  const info = el("div");
  const meta = `${timeLabel(stampDate(f.name))} · ${prettySize(f.size)}` + (f.complete ? "" : ` · 上傳不完整(${f.parts.length}/${f.total} 段),請刪除後重傳`);
  info.append(el("div", "file-name", displayName(f.name)), el("div", "muted", meta));
  const acts = el("div", "actions");
  const dl = el("button", "ghost", "下載");
  dl.disabled = !f.complete;
  dl.onclick = async () => {
    dl.disabled = true; dl.textContent = "下載中…";
    try { await downloadParts(f, i => { if (f.total > 1) dl.textContent = `下載中 ${i}/${f.total}…`; }); }
    catch (e) { alert("下載失敗:" + e.message); }
    dl.disabled = false; dl.textContent = "下載";
  };
  const del = el("button", "ghost danger", "刪除");
  del.onclick = async () => {
    if (!confirm(`刪除「${displayName(f.name)}」?`)) return;
    del.disabled = true; del.textContent = "刪除中…";
    try {
      // 每次刪除都是一個 commit,要依序刪,並行會撞版本衝突
      for (const p of f.parts) await deletePath(p.path, p.sha);
      li.remove();
      if (!$("files").children.length) $("files").appendChild(el("li", "muted", "還沒有檔案"));
      scheduleClean();
    } catch (e) { alert("刪除失敗:" + e.message); refreshFiles(); }
  };
  acts.append(dl, del);
  li.append(info, acts);
  return li;
}

// ---------- 上傳佇列:每個檔一列進度,依序傳 ----------
const jobs = [];
let pumping = false;

function addFiles(files) {
  for (const f of files) {
    const job = { file: f, state: "wait", msg: "", total: Math.max(1, Math.ceil(f.size / CHUNK_BYTES)) };
    if (f.size > MAX_BYTES) { job.state = "fail"; job.msg = "超過 10 GB,無法上傳"; }
    job.li = el("li");
    const top = el("div", "file-row");
    job.msgEl = el("div", "muted");
    const info = el("div"); info.append(el("div", "file-name", f.name), job.msgEl);
    job.retry = el("button", "ghost hidden", "重試");
    job.retry.onclick = () => { job.state = "wait"; paint(job); pump(); };
    top.append(info, job.retry);
    job.bar = el("div", "bar"); job.bar.appendChild(el("i"));
    job.li.append(top, job.bar);
    $("queue").prepend(job.li);
    jobs.push(job);
    paint(job);
  }
  pump();
}
function paint(job, pct) {
  const size = prettySize(job.file.size);
  const fill = job.bar.firstChild;
  job.bar.classList.remove("busy");
  job.retry.classList.toggle("hidden", job.state !== "fail" || job.file.size > MAX_BYTES);
  if (job.state === "wait") {
    job.msgEl.className = "muted";
    job.msgEl.textContent = `${size} · 排隊中`;
    fill.style.width = "0";
  } else if (job.state === "run") {
    job.msgEl.className = "muted";
    job.msgEl.textContent = `${size} · 上傳中… ${job.msg}`;
    if (pct == null) job.bar.classList.add("busy"); else fill.style.width = pct + "%";
  } else if (job.state === "done") {
    job.msgEl.className = "ok";
    job.msgEl.textContent = `${size} · 已存好 ✓`;
    fill.style.width = "100%";
    setTimeout(() => job.li.remove(), 8000);
  } else {
    job.msgEl.className = "err";
    job.msgEl.textContent = `${size} · 失敗:${job.msg}` + (job.total > 1 && job.base ? "(按重試會從斷掉的那段接著傳)" : "");
    fill.style.width = "0";
  }
}

async function uploadJob(job) {
  const f = job.file;
  const safe = f.name.replace(/[\\/]/g, "_");
  if (!job.base) job.base = `files/${stamp()}_${safe}`;
  if (job.total === 1) {
    await putFile(job.base, await blobToB64(f), "upload " + safe);
    return;
  }
  // 重試時跳過已經傳上去的段
  const prefix = job.base.replace(/^files\//, "");
  const have = new Set((await listDir("files")).filter(i => i.name.startsWith(prefix + ".part")).map(i => i.name));
  const started = Date.now();
  let sent = 0;
  for (let i = 0; i < job.total; i++) {
    const name = `${prefix}.part${i + 1}of${job.total}`;
    const pct = Math.floor(i / job.total * 100);
    const secs = (Date.now() - started) / 1000;
    const speed = sent && secs > 1 ? ` · ${prettySize(sent / secs)}/秒` : "";
    job.msg = `第 ${i + 1}/${job.total} 段 ${pct}%${speed}`;
    paint(job, pct);
    if (have.has(name)) continue;
    const piece = f.slice(i * CHUNK_BYTES, (i + 1) * CHUNK_BYTES);
    await putFile("files/" + name, await blobToB64(piece), `upload ${safe} (${i + 1}/${job.total})`,
      wait => { job.msg = `GitHub 要求放慢,等 ${wait} 秒後繼續…`; paint(job, pct); });
    sent += piece.size;
  }
}

async function pump() {
  if (pumping) return;
  pumping = true;
  try {
    for (;;) {
      const job = jobs.find(j => j.state === "wait");
      if (!job) break;
      job.state = "run"; job.msg = ""; paint(job);
      try {
        await uploadJob(job);
        job.state = "done";
      } catch (e) { job.state = "fail"; job.msg = e.message; }
      paint(job);
      refreshFiles();   // 每存好一個就更新清單,不用等全部傳完
    }
  } finally { pumping = false; }
}

// ---------- 拖放、選檔、貼上 ----------
// 整個視窗都接檔案,而且一律擋掉瀏覽器「直接打開檔案」的預設行為
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
let dragDepth = 0;
window.addEventListener("dragenter", e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth++;
  if (token) $("overlay").classList.add("show");
});
window.addEventListener("dragover", e => { if (hasFiles(e)) { e.preventDefault(); e.dataTransfer.dropEffect = token ? "copy" : "none"; } });
window.addEventListener("dragleave", e => {
  if (!hasFiles(e)) return;
  if (--dragDepth <= 0) { dragDepth = 0; $("overlay").classList.remove("show"); }
});
window.addEventListener("drop", e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  $("overlay").classList.remove("show");
  if (!token) { setStatus($("loginStatus"), "先輸入金鑰,再拖檔案進來", "err"); return; }
  // 資料夾不能直接傳,挑出來提醒
  const items = [...(e.dataTransfer.items || [])];
  const isDir = i => i.webkitGetAsEntry && i.webkitGetAsEntry()?.isDirectory;
  const dirs = items.filter(isDir).length;
  const files = items.length
    ? items.filter(i => i.kind === "file" && !isDir(i)).map(i => i.getAsFile()).filter(Boolean)
    : [...e.dataTransfer.files];
  if (dirs) alert(`有 ${dirs} 個資料夾沒辦法直接存,請打開資料夾、把裡面的檔案拖進來。`);
  if (files.length) addFiles(files);
});
$("drop").onclick = () => $("fileInput").click();
$("fileInput").onchange = e => { addFiles([...e.target.files]); e.target.value = ""; };
document.addEventListener("paste", e => {
  if (!token) return;
  const files = [...(e.clipboardData?.files || [])];
  if (files.length) { e.preventDefault(); addFiles(files); }
});
// 還在上傳就關分頁會中斷,先提醒
window.addEventListener("beforeunload", e => {
  if (jobs.some(j => j.state === "run" || j.state === "wait")) { e.preventDefault(); e.returnValue = ""; }
});

// ---------- 啟動 ----------
const saved = readStored();
let savedInLocal = false;
try { savedInLocal = !!localStorage.getItem("drop_token"); } catch {}
if (saved) tryLogin(saved, savedInLocal, true); else showLogin();
</script>
</body>
