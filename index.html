<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>我的收件匣</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --line: #e3e6eb; --accent: #2563eb; --accent-soft: #e8efff; --accent-text: #ffffff;
    --danger: #c0392b; --ok: #15803d; --warn-bg: #fff7e0; --warn-line: #f1d48a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --card: #1d2128; --text: #e6e8eb; --muted: #9aa3ae;
      --line: #2e333b; --accent: #4f8cff; --accent-soft: #1d2a45; --accent-text: #ffffff;
      --danger: #ef6b5b; --ok: #4ade80; --warn-bg: #2e2716; --warn-line: #6b5a2a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  h2 { font-size: 17px; margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  textarea, input[type=password] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); font: inherit;
  }
  textarea { min-height: 110px; resize: vertical; }
  button {
    font: inherit; border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer;
    background: var(--accent); color: var(--accent-text);
  }
  button.ghost, a.ghost {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    padding: 4px 10px; font-size: 14px; border-radius: 8px; text-decoration: none; cursor: pointer;
  }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .muted { color: var(--muted); font-size: 14px; }
  .status { font-size: 14px; min-height: 1.4em; }
  .status.err, .err { color: var(--danger); }
  .status.ok, .ok { color: var(--ok); }

  .drop {
    border: 2px dashed var(--line); border-radius: 12px; padding: 36px 16px; text-align: center;
    color: var(--muted); cursor: pointer; transition: background .15s, border-color .15s;
  }
  .drop:hover { border-color: var(--accent); }
  .drop .big { font-size: 18px; color: var(--text); margin-bottom: 4px; }

  /* 整頁拖放:檔案拖進視窗任何地方都會出現這層 */
  #overlay {
    position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--accent) 18%, transparent); backdrop-filter: blur(2px);
  }
  #overlay.show { display: flex; }
  #overlay div {
    background: var(--card); color: var(--accent); border: 3px dashed var(--accent); border-radius: 16px;
    padding: 40px 48px; font-size: 22px; pointer-events: none; text-align: center;
  }

  .need-g {
    background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 10px;
    padding: 12px; margin-top: 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  }

  ul { list-style: none; margin: 12px 0 0; padding: 0; }
  li { border-top: 1px solid var(--line); padding: 10px 0; }
  #queue li:first-child { border-top: 0; }
  .note-text { white-space: pre-wrap; word-break: break-word; margin: 0 0 6px; }
  .file-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .file-name { word-break: break-all; }
  .actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
  .tag { font-size: 12px; padding: 0 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; white-space: nowrap; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .bar.busy i { width: 35%; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  .hidden { display: none !important; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div id="overlay"><div>放開就存檔</div></div>
<main>
  <h1><span>我的收件匣</span><button id="logout" class="ghost hidden">登出這台裝置</button></h1>

  <!-- 登入 -->
  <section id="login" class="card hidden">
    <h2>輸入金鑰</h2>
    <p class="muted">內容存在你的私人 GitHub repo,沒有金鑰的人打開這頁什麼都看不到。金鑰只存在這台裝置的瀏覽器裡。</p>
    <input id="token" type="password" placeholder="github_pat_…" autocomplete="off">
    <div class="row">
      <label class="muted"><input id="remember" type="checkbox" checked> 記住這台裝置</label>
      <button id="loginBtn">進入</button>
    </div>
    <div id="loginStatus" class="status"></div>
  </section>

  <div id="app" class="hidden">
    <!-- 檔案 -->
    <section class="card">
      <div class="card-head">
        <h2>檔案</h2>
        <span><span id="gStatus" class="muted"></span> <button id="gLogin" class="ghost">連結 Google 雲端硬碟</button></span>
      </div>
      <div id="drop" class="drop">
        <div class="big">把檔案拖進這個視窗任何地方就存好</div>
        也可以點這裡選檔,或按 Ctrl+V 貼上檔案<br>
        <span class="muted">30 MB 以下存 GitHub;更大的(最大 10 GB)存到 Google 雲端硬碟「收件匣大檔」</span>
      </div>
      <input id="fileInput" type="file" multiple class="hidden">

      <div id="needG" class="need-g hidden">
        <span id="needGText">有大檔要存到 Google 雲端硬碟</span>
        <button id="needGBtn">連結 Google 並開始上傳</button>
      </div>
      <ul id="queue"></ul>

      <ul id="files"></ul>
      <div id="usage" class="muted" style="margin-top:8px"></div>
    </section>

    <!-- 文字 -->
    <section class="card">
      <div class="card-head"><h2>文字</h2></div>
      <textarea id="noteInput" placeholder="貼上要存的文字…(Ctrl+Enter 儲存)"></textarea>
      <div class="row">
        <button id="saveNote">儲存</button>
        <span id="noteStatus" class="status"></span>
      </div>
      <ul id="notes"></ul>
      <div class="row"><button id="moreNotes" class="ghost hidden">顯示更多</button></div>
    </section>
  </div>
</main>

<script>
// 儲存空間:私人 repo。網頁本身放在公開 repo,不含任何秘密。
const OWNER = "city2243";
const REPO = "drop-storage";
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;
// GitHub 建議 repo 小於 1 GB、最好別超過 5 GB;刪掉的檔仍留在歷史,所以要顯示已用量
const WARN_KB = 1024 * 1024;
// GitHub API 單次寫入實測約 38–40 MB 就回 422;超過這個大小的檔改存 Google 雲端硬碟。
// 舊版曾把大檔切成 .partNofM 存,列表與下載仍認得。
const SMALL_MAX = 30 * 1024 * 1024;

// Google 雲端硬碟(大檔)。用戶端 ID 是公開識別碼,不是秘密。
// drive.file 權限只看得到這個網頁自己建的檔,碰不到雲端硬碟裡其他東西。
const G_CLIENT_ID = "223483846838-pb0tgrcda86fgahe5jvandt8e2b5i2ai.apps.googleusercontent.com";
const G_SCOPE = "https://www.googleapis.com/auth/drive.file";
const G_FOLDER = "收件匣大檔";
const G_MAX = 10 * 1024 * 1024 * 1024;
const G_CHUNK = 64 * 1024 * 1024;   // 續傳分段,必須是 256 KB 的倍數
const G_FILES = "https://www.googleapis.com/drive/v3/files";
const PART_RE = /\.part(\d+)of(\d+)$/;
const NOTES_PAGE = 30;

const $ = id => document.getElementById(id);
let token = "";
let noteEntries = [];   // notes/ 目錄清單(新到舊)
let notesShown = 0;

function readStored() {
  try { return localStorage.getItem("drop_token") || sessionStorage.getItem("drop_token") || ""; }
  catch { return ""; }
}
function store(t, remember) {
  try {
    if (remember) localStorage.setItem("drop_token", t); else sessionStorage.setItem("drop_token", t);
  } catch {}
}
function forget() {
  try { localStorage.removeItem("drop_token"); sessionStorage.removeItem("drop_token"); } catch {}
}

function setStatus(el, msg, kind) {
  el.textContent = msg;
  el.className = "status" + (kind ? " " + kind : "");
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function encPath(path) {
  return path.split("/").map(encodeURIComponent).join("/");
}

async function gh(path, opts = {}) {
  const res = await fetch(API + encPath(path), {
    ...opts,
    headers: {
      "Authorization": "Bearer " + token,
      "Accept": opts.accept || "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      ...(opts.body ? { "Content-Type": "application/json" } : {}),
    },
    cache: "no-store",
  });
  if (res.status === 404 && opts.allow404) return null;
  if (!res.ok) {
    let msg = res.status + " " + res.statusText;
    try { const j = await res.json(); if (j.message) msg = res.status + " " + j.message; } catch {}
    throw new Error(msg);
  }
  return res;
}

function bytesToB64(bytes) {
  let bin = "";
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}

// 用瀏覽器內建的 FileReader 轉 base64,大檔比逐字元拼字串省記憶體
function blobToB64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.slice(r.result.indexOf(",") + 1));
    r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });
}

function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function stampDate(name) {
  const m = name.match(/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})/);
  return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]) : new Date(0);
}
function timeLabel(d) {
  const p = n => String(n).padStart(2, "0");
  return d.getTime() ? `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}` : "";
}
function prettySize(n) {
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + " MB";
  return (n / 1024 / 1024 / 1024).toFixed(2) + " GB";
}

async function putFile(path, b64, message) {
  return gh(path, { method: "PUT", body: JSON.stringify({ message, content: b64 }) });
}
async function deletePath(path, sha) {
  return gh(path, { method: "DELETE", body: JSON.stringify({ message: "delete " + path, sha }) });
}
async function listDir(dir) {
  const res = await gh(dir, { allow404: true });
  if (!res) return [];
  const items = await res.json();
  return items.filter(i => i.type === "file" && i.name !== ".keep")
              .sort((a, b) => b.name.localeCompare(a.name));
}
async function rawBlob(path) {
  const res = await gh(path, { accept: "application/vnd.github.raw" });
  return res.blob();
}

// ---------- 登入 ----------
async function tryLogin(t, remember, quiet) {
  token = t.trim();
  if (!token) return;
  try {
    // 用 repo 根目錄測試金鑰能不能讀
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`, {
      headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" },
      cache: "no-store",
    });
    if (!res.ok) throw new Error(res.status === 401 ? "金鑰無效或已過期" : res.status === 404 ? "這把金鑰讀不到儲存空間(建立時要勾 drop-storage)" : "錯誤 " + res.status);
    store(token, remember);
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("logout").classList.remove("hidden");
    if (G_CLIENT_ID && gRestoreToken()) gAfterLogin();
    loadNotes(); refreshFiles();
  } catch (e) {
    token = "";
    if (quiet) forget();
    showLogin(quiet ? "記住的金鑰失效了,請重新輸入:" + e.message : e.message);
  }
}
function showLogin(msg) {
  $("app").classList.add("hidden");
  $("logout").classList.add("hidden");
  $("login").classList.remove("hidden");
  setStatus($("loginStatus"), msg || "", msg ? "err" : "");
}
$("loginBtn").onclick = () => tryLogin($("token").value, $("remember").checked, false);
$("token").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });
$("logout").onclick = () => { forget(); token = ""; $("token").value = ""; showLogin(); };

// ---------- 文字 ----------
async function loadNotes() {
  $("notes").innerHTML = '<li class="muted">載入中…</li>';
  try {
    noteEntries = await listDir("notes");
    notesShown = 0;
    $("notes").innerHTML = noteEntries.length ? "" : '<li class="muted">還沒有文字</li>';
    await showMoreNotes();
  } catch (e) { $("notes").innerHTML = `<li class="status err">讀取失敗:${e.message}</li>`; }
}
async function showMoreNotes() {
  const batch = noteEntries.slice(notesShown, notesShown + NOTES_PAGE);
  notesShown += batch.length;
  const texts = await Promise.all(batch.map(n => rawBlob(n.path).then(b => b.text()).catch(() => "(讀取失敗)")));
  batch.forEach((n, i) => $("notes").appendChild(noteItem(n, texts[i])));
  $("moreNotes").classList.toggle("hidden", notesShown >= noteEntries.length);
}
function noteItem(n, text) {
  const li = el("li");
  const row = el("div", "file-row");
  const acts = el("div", "actions");
  const copy = el("button", "ghost", "複製");
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(text); copy.textContent = "已複製"; }
    catch { copy.textContent = "複製失敗"; }
    setTimeout(() => copy.textContent = "複製", 1500);
  };
  const del = el("button", "ghost danger", "刪除");
  del.onclick = async () => {
    if (!confirm("刪除這則文字?")) return;
    del.disabled = true;
    try { await deletePath(n.path, n.sha); li.remove(); }
    catch (e) { alert("刪除失敗:" + e.message); del.disabled = false; }
  };
  acts.append(copy, del);
  row.append(el("span", "muted", timeLabel(stampDate(n.name))), acts);
  li.append(el("p", "note-text", text), row);
  return li;
}
async function saveNote(text) {
  const b64 = bytesToB64(new TextEncoder().encode(text));
  await putFile(`notes/${stamp()}.txt`, b64, "add note");
}
$("moreNotes").onclick = showMoreNotes;
$("saveNote").onclick = async () => {
  const text = $("noteInput").value;
  if (!text.trim()) return;
  $("saveNote").disabled = true;
  setStatus($("noteStatus"), "儲存中…");
  try {
    await saveNote(text);
    $("noteInput").value = "";
    setStatus($("noteStatus"), "已儲存", "ok");
    loadNotes();
  } catch (e) { setStatus($("noteStatus"), "儲存失敗:" + e.message, "err"); }
  $("saveNote").disabled = false;
};
$("noteInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("saveNote").click();
});

// ---------- 檔案清單(GitHub 小檔 + 雲端硬碟大檔合成一張,新到舊) ----------
function displayName(name) { return name.replace(/^\d{8}-\d{6}_/, ""); }

// 把分段檔(xxx.part1of4 …)合成一筆;沒分段的檔就是只有一段
function groupFiles(items) {
  const groups = new Map();
  for (const it of items) {
    const m = it.name.match(PART_RE);
    const base = m ? it.name.replace(PART_RE, "") : it.name;
    if (!groups.has(base)) groups.set(base, { name: base, parts: [], total: m ? Number(m[2]) : 1, size: 0 });
    const g = groups.get(base);
    g.parts.push({ ...it, idx: m ? Number(m[1]) : 1 });
    g.size += it.size;
  }
  for (const g of groups.values()) {
    g.parts.sort((a, b) => a.idx - b.idx);
    g.complete = g.parts.length === g.total;
  }
  return [...groups.values()];
}

let ghGroups = [], gList = null, filesErr = "";
async function refreshFiles() {
  loadUsage();
  filesErr = "";
  await Promise.all([
    listDir("files").then(items => { ghGroups = groupFiles(items); })
      .catch(e => { filesErr += "GitHub 讀取失敗:" + e.message + " "; }),
    gTokenValid()
      ? gListFiles().then(l => { gList = l; }).catch(e => { gList = null; filesErr += "雲端硬碟讀取失敗:" + e.message; })
      : Promise.resolve(gList = null),
  ]);
  renderFiles();
}
function renderFiles() {
  const rows = [
    ...ghGroups.map(g => ({ t: stampDate(g.name), li: () => fileItem(g) })),
    ...(gList || []).map(f => ({ t: new Date(f.createdTime), li: () => gFileItem(f) })),
  ].sort((a, b) => b.t - a.t);
  const ul = $("files");
  ul.innerHTML = "";
  if (filesErr) ul.appendChild(el("li", "status err", filesErr));
  if (!rows.length && !filesErr) ul.appendChild(el("li", "muted", "還沒有檔案"));
  rows.forEach(r => ul.appendChild(r.li()));
  if (gList === null && G_CLIENT_ID) ul.appendChild(el("li", "muted", "存在 Google 雲端硬碟的大檔,要按右上角「連結 Google 雲端硬碟」才會列出來"));
}

async function loadUsage() {
  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`, {
      headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" }, cache: "no-store",
    });
    const kb = (await res.json()).size;
    const u = $("usage");
    u.textContent = `GitHub 空間已用約 ${prettySize(kb * 1024)}(含已刪除檔案的歷史,建議 1 GB 以內)`;
    u.className = kb > WARN_KB ? "status err" : "muted";
  } catch {}
}

function fileItem(f) {
  const li = el("li", "file-row");
  const info = el("div");
  const meta = `${timeLabel(stampDate(f.name))} · ${prettySize(f.size)}` + (f.complete ? "" : ` · 上傳不完整(${f.parts.length}/${f.total} 段),請刪除後重傳`);
  info.append(el("div", "file-name", displayName(f.name)), el("div", "muted", meta));
  const acts = el("div", "actions");
  const dl = el("button", "ghost", "下載");
  dl.disabled = !f.complete;
  dl.onclick = async () => {
    dl.disabled = true; dl.textContent = "下載中…";
    try {
      const pieces = [];
      for (const p of f.parts) {
        if (f.parts.length > 1) dl.textContent = `下載中 ${p.idx}/${f.total}…`;
        pieces.push(await rawBlob(p.path));
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(pieces));
      a.download = displayName(f.name);
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    } catch (e) { alert("下載失敗:" + e.message); }
    dl.disabled = false; dl.textContent = "下載";
  };
  const del = el("button", "ghost danger", "刪除");
  del.onclick = async () => {
    if (!confirm(`刪除「${displayName(f.name)}」?`)) return;
    del.disabled = true;
    try {
      // 每次刪除都是一個 commit,要依序刪,並行會撞版本衝突
      for (const p of f.parts) await deletePath(p.path, p.sha);
      ghGroups = ghGroups.filter(g => g !== f);
      li.remove();
    } catch (e) { alert("刪除失敗:" + e.message); del.disabled = false; refreshFiles(); }
  };
  acts.append(dl, del);
  li.append(info, acts);
  return li;
}
function gFileItem(f) {
  const li = el("li", "file-row");
  const info = el("div");
  const name = el("div", "file-name", f.name);
  name.appendChild(el("span", "tag", "雲端硬碟"));
  info.append(name, el("div", "muted", `${timeLabel(new Date(f.createdTime))} · ${prettySize(Number(f.size || 0))}`));
  const acts = el("div", "actions");
  // 大檔交給雲端硬碟自己的下載,瀏覽器不用把整個檔塞進記憶體
  const open = el("a", "ghost", "開啟/下載");
  open.href = f.webViewLink; open.target = "_blank"; open.rel = "noopener";
  const del = el("button", "ghost danger", "刪除");
  del.onclick = async () => {
    if (!confirm(`把「${f.name}」移到雲端硬碟的垃圾桶?(30 天內可救回)`)) return;
    del.disabled = true;
    try {
      await gApi(`${G_FILES}/${f.id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ trashed: true }) });
      gList = (gList || []).filter(x => x !== f);
      li.remove();
    } catch (e) { alert("刪除失敗:" + e.message); del.disabled = false; }
  };
  acts.append(open, del);
  li.append(info, acts);
  return li;
}

// ---------- 上傳佇列:每個檔一列進度,依序傳 ----------
const jobs = [];
let pumping = false;

function addFiles(files) {
  for (const f of files) {
    const job = { file: f, big: f.size > SMALL_MAX, state: "wait", msg: "" };
    if (f.size > G_MAX) { job.state = "fail"; job.msg = "超過 10 GB,無法上傳"; }
    job.li = el("li");
    const top = el("div", "file-row");
    job.nameEl = el("div", "file-name", f.name);
    job.msgEl = el("div", "muted");
    const info = el("div"); info.append(job.nameEl, job.msgEl);
    job.retry = el("button", "ghost hidden", "重試");
    job.retry.onclick = () => { job.state = "wait"; paint(job); pump(); };
    top.append(info, job.retry);
    job.bar = el("div", "bar"); job.bar.appendChild(el("i"));
    job.li.append(top, job.bar);
    $("queue").prepend(job.li);
    jobs.push(job);
    paint(job);
  }
  pump();
}
function paint(job, pct) {
  const size = prettySize(job.file.size);
  const where = job.big ? "雲端硬碟" : "GitHub";
  const fill = job.bar.firstChild;
  job.bar.classList.remove("busy");
  job.retry.classList.toggle("hidden", job.state !== "fail" || job.file.size > G_MAX);
  if (job.state === "wait") {
    job.msgEl.className = "muted";
    job.msgEl.textContent = job.big && !gTokenValid() ? `${size} · 等待連結 Google…` : `${size} · 排隊中`;
    fill.style.width = "0";
  } else if (job.state === "run") {
    job.msgEl.className = "muted";
    job.msgEl.textContent = `${size} · 上傳到${where}… ${job.msg}`;
    if (pct == null) job.bar.classList.add("busy"); else fill.style.width = pct + "%";
  } else if (job.state === "done") {
    job.msgEl.className = "ok";
    job.msgEl.textContent = `${size} · 已存到${where} ✓`;
    fill.style.width = "100%";
    setTimeout(() => job.li.remove(), 8000);
  } else {
    job.msgEl.className = "err";
    job.msgEl.textContent = `${size} · 失敗:${job.msg}`;
    fill.style.width = "0";
  }
}
function updateNeedG() {
  const n = jobs.filter(j => j.state === "wait" && j.big).length;
  const show = n > 0 && !gTokenValid();
  $("needG").classList.toggle("hidden", !show);
  if (show) $("needGText").textContent = `有 ${n} 個大檔(超過 30 MB)要存到 Google 雲端硬碟,要先連結一次`;
}
async function pump() {
  if (pumping) return;
  pumping = true;
  try {
    for (;;) {
      const job = jobs.find(j => j.state === "wait" && (!j.big || gTokenValid()));
      if (!job) break;
      job.state = "run"; job.msg = ""; paint(job);
      try {
        if (job.big) {
          await gUpload(job.file, (pct, msg) => { job.msg = msg; paint(job, pct); });
        } else {
          const safe = job.file.name.replace(/[\\/]/g, "_");
          await putFile(`files/${stamp()}_${safe}`, await blobToB64(job.file), "upload " + safe);
        }
        job.state = "done";
        refreshFiles();   // 每存好一個就更新清單,不用等全部傳完
      } catch (e) { job.state = "fail"; job.msg = e.message; }
      paint(job);
    }
  } finally { pumping = false; }
  jobs.filter(j => j.state === "wait").forEach(j => paint(j));
  updateNeedG();
}

// ---------- Google 雲端硬碟(大檔) ----------
let gToken = "", gExpiry = 0, gClient = null, gFolderId = "";

function gTokenValid() { return !!gToken && Date.now() < gExpiry; }
// 只能在使用者「點擊」的當下呼叫:瀏覽器會擋掉拖放或程式觸發的彈出視窗
function gRequestToken(prompt) {
  return new Promise((resolve, reject) => {
    if (!G_CLIENT_ID) return reject(new Error("還沒設定 Google 用戶端 ID"));
    if (!window.google?.accounts?.oauth2) return reject(new Error("Google 登入元件還沒載入,稍後再試"));
    if (!gClient) gClient = google.accounts.oauth2.initTokenClient({ client_id: G_CLIENT_ID, scope: G_SCOPE, callback: () => {} });
    gClient.callback = r => {
      if (r.error) return reject(new Error(r.error_description || r.error));
      gToken = r.access_token;
      gExpiry = Date.now() + (Number(r.expires_in) - 120) * 1000;
      try { sessionStorage.setItem("drop_gtoken", JSON.stringify({ t: gToken, e: gExpiry })); } catch {}
      resolve();
    };
    gClient.error_callback = e => reject(new Error(
      e.type === "popup_closed" ? "Google 登入視窗被關掉了" :
      e.type === "popup_failed_to_open" ? "瀏覽器擋住了 Google 登入視窗,請允許這個網站開彈出視窗" :
      "Google 登入失敗:" + (e.type || "")));
    gClient.requestAccessToken({ prompt });
  });
}
function gRestoreToken() {
  try {
    const s = JSON.parse(sessionStorage.getItem("drop_gtoken") || "null");
    if (s && Date.now() < s.e) { gToken = s.t; gExpiry = s.e; return true; }
  } catch {}
  return false;
}
function gAfterLogin() {
  $("gLogin").textContent = "重新連結";
  $("gStatus").textContent = "Google 已連結";
  $("gStatus").className = "ok";
  // 權杖約 1 小時後失效,到期時把狀態改回來,大檔會改成等待連結
  clearTimeout(gAfterLogin.t);
  gAfterLogin.t = setTimeout(() => {
    $("gLogin").textContent = "連結 Google 雲端硬碟";
    $("gStatus").textContent = "";
    updateNeedG();
  }, Math.max(0, gExpiry - Date.now()));
}
function gConnect() {
  return gRequestToken(gTokenValid() ? "" : "select_account")
    .then(() => { gAfterLogin(); updateNeedG(); pump(); refreshFiles(); })
    .catch(e => { $("gStatus").textContent = e.message; $("gStatus").className = "err"; });
}
$("gLogin").onclick = gConnect;
$("needGBtn").onclick = gConnect;

async function gApi(url, opts = {}) {
  if (!gTokenValid()) throw new Error("Google 連結已過期,請重新連結");
  const res = await fetch(url, { ...opts, headers: { "Authorization": "Bearer " + gToken, ...(opts.headers || {}) } });
  if (!res.ok) {
    let msg = String(res.status);
    try { const j = await res.json(); if (j.error?.message) msg += " " + j.error.message; } catch {}
    if (res.status === 401) { gToken = ""; msg = "Google 連結已過期,請重新連結"; }
    throw new Error(msg);
  }
  return res;
}
async function gFolder() {
  if (gFolderId) return gFolderId;
  const q = encodeURIComponent(`name='${G_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const found = await (await gApi(`${G_FILES}?q=${q}&fields=files(id)`)).json();
  if (found.files.length) return gFolderId = found.files[0].id;
  const made = await (await gApi(`${G_FILES}?fields=id`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: G_FOLDER, mimeType: "application/vnd.google-apps.folder" }),
  })).json();
  return gFolderId = made.id;
}
async function gListFiles() {
  const q = encodeURIComponent(`'${await gFolder()}' in parents and trashed=false`);
  const j = await (await gApi(`${G_FILES}?q=${q}&orderBy=createdTime%20desc&pageSize=200&fields=files(id,name,size,createdTime,webViewLink)`)).json();
  return j.files;
}

// 續傳上傳:先開一個上傳工作,再每 64 MB 送一段;斷線就問伺服器收到哪裡,從那裡接著送
async function gUpload(f, onProgress) {
  const init = await gApi("https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id", {
    method: "POST",
    headers: {
      "Content-Type": "application/json; charset=UTF-8",
      "X-Upload-Content-Length": String(f.size),
      "X-Upload-Content-Type": f.type || "application/octet-stream",
    },
    body: JSON.stringify({ name: f.name, parents: [await gFolder()] }),
  });
  const session = init.headers.get("Location");
  if (!session) throw new Error("拿不到上傳網址");
  const auth = () => gTokenValid() ? { "Authorization": "Bearer " + gToken } : {};
  const nextOffset = (res, fallback) => {
    const r = res.headers.get("Range");
    return r ? Number(r.split("-")[1]) + 1 : fallback;
  };
  const started = Date.now();
  let offset = 0, tries = 0;
  while (true) {
    const end = Math.min(offset + G_CHUNK, f.size);
    const secs = (Date.now() - started) / 1000;
    const speed = secs > 1 ? ` · ${prettySize(offset / secs)}/秒` : "";
    const pct = Math.floor(offset / f.size * 100);
    onProgress(pct, `${pct}%${speed}`);
    let res = null;
    try {
      res = await fetch(session, {
        method: "PUT",
        headers: { ...auth(), "Content-Range": `bytes ${offset}-${end - 1}/${f.size}` },
        body: f.slice(offset, end),
      });
    } catch {}
    if (res && (res.status === 200 || res.status === 201)) return res.json();
    if (res && res.status === 308) { offset = nextOffset(res, end); tries = 0; continue; }
    if (res && (res.status === 404 || res.status === 410)) throw new Error("上傳工作已失效,請重試");
    if (++tries > 6) throw new Error("上傳中斷" + (res ? `(${res.status})` : "(網路)"));
    await new Promise(r => setTimeout(r, 2000 * tries));
    try {
      const q = await fetch(session, { method: "PUT", headers: { ...auth(), "Content-Range": `bytes */${f.size}` } });
      if (q.status === 200 || q.status === 201) return q.json();
      if (q.status === 308) offset = nextOffset(q, 0);
    } catch {}
  }
}

// ---------- 拖放、選檔、貼上 ----------
// 整個視窗都接檔案,而且一律擋掉瀏覽器「直接打開檔案」的預設行為
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
let dragDepth = 0;
window.addEventListener("dragenter", e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth++;
  if (token) $("overlay").classList.add("show");
});
window.addEventListener("dragover", e => { if (hasFiles(e)) { e.preventDefault(); e.dataTransfer.dropEffect = token ? "copy" : "none"; } });
window.addEventListener("dragleave", e => {
  if (!hasFiles(e)) return;
  if (--dragDepth <= 0) { dragDepth = 0; $("overlay").classList.remove("show"); }
});
window.addEventListener("drop", e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  $("overlay").classList.remove("show");
  if (!token) { setStatus($("loginStatus"), "先輸入金鑰,再拖檔案進來", "err"); return; }
  // 資料夾不能直接傳,挑出來提醒
  const items = [...(e.dataTransfer.items || [])];
  const isDir = i => i.webkitGetAsEntry && i.webkitGetAsEntry()?.isDirectory;
  const dirs = items.filter(isDir).length;
  const files = items.length
    ? items.filter(i => i.kind === "file" && !isDir(i)).map(i => i.getAsFile()).filter(Boolean)
    : [...e.dataTransfer.files];
  if (dirs) alert(`有 ${dirs} 個資料夾沒辦法直接存,請打開資料夾、把裡面的檔案拖進來。`);
  if (files.length) addFiles(files);
});
$("drop").onclick = () => $("fileInput").click();
$("fileInput").onchange = e => { addFiles([...e.target.files]); e.target.value = ""; };
document.addEventListener("paste", e => {
  if (!token) return;
  const files = [...(e.clipboardData?.files || [])];
  if (files.length) { e.preventDefault(); addFiles(files); }
});

// ---------- 啟動 ----------
if (!G_CLIENT_ID) $("gLogin").classList.add("hidden");
const saved = readStored();
let savedInLocal = false;
try { savedInLocal = !!localStorage.getItem("drop_token"); } catch {}
if (saved) tryLogin(saved, savedInLocal, true); else showLogin();
</script>
